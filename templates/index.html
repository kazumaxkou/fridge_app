<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>冷蔵庫管理アプリ</title>
    <link rel="manifest" href="/manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js");
        }
    </script>

</head>
<body>
    <h1>冷蔵庫の中身</h1>

    <form action="/add" method="post">
        <input type="text" name="name" placeholder="食材名" required>
        <input type="text" name="qty" placeholder="数量" required>
        <button type="submit">追加</button>
    </form>

    <ul>
        {% for item in items %}
            <li>
                {{ item.name }} - {{ item.qty }}
                <a href="/delete/{{ loop.index0 }}">削除</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
