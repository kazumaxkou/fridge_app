<!DOCTYPE html>
<html lang="ja">

<head>

    <!-- PWA 関連のタグ -->
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/service-worker.js");
        }
    </script>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- スマホ対応の最重要行 -->

    <title>食品管理アプリ</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        /* 入力フォーム（スマホでは縦並び） */
        .form-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
        }

        /* 食材リストをカード風に */
        .item-card {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* PC：横並び */
        .expire-row {
            display: flex;
            gap: 6px;
        }

        /* スマホ：縦並びにする */
        @media (max-width: 600px) {
            .expire-row {
                display: block;
            }

            .days-left {
                display: block;
                margin-top: 4px;
            }
        }


        .expired {
            color: red;
            font-weight: bold;
        }

        .near {
            color: orange;
            font-weight: bold;
        }

        .delete-btn,
        .edit-btn {
            color: white;
            background: #e74c3c;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .edit-btn {
            background: #3498db;
        }

        .action-buttons {
            display: flex;
            flex-direction: row;
            gap: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <h1>賞味期限には注意！</h1>

    <form action="/add" method="post" class="form-container">
        <input type="text" name="name" placeholder="食品名" required>
        <input type="number" name="qty" placeholder="量" required inputmode="numeric" pattern="[0-9]*">
         <!-- 単位を選択 -->
        <select name="unit" required>
            <option value="g">g</option>
            <option value="個">個</option>
            <option value="本">本</option>
            <option value="匹">匹</option>
            <option value="ml">ml</option>
            <option value="袋">袋</option>
            <option value="枚">枚</option>
        </select>
        <input type="date" name="exp" required>
        
        <button type="submit">追加</button>
    </form>

    {% for item in items %}
    <div class="item-card 
            {% if item.expired %}expired{% endif %} 
            {% if item.near %}near{% endif %}">

        <div class="item-info">
            <span>{{ item.name }} - {{ item.qty }} {{ item.unit }}</span>

            <div class="expire-row">
                <span class="expire-date">賞味期限: {{ item.exp }}</span>
                <span class="days-left">
                    {% if item.expired %}
                    （{{ item.days_left|abs }} 日期限切れ）
                    {% else %}
                    （残り {{ item.days_left }} 日）
                    {% endif %}
                </span>
            </div>
        </div>

        <span class="action-buttons">
            <a class="edit-btn" href="/edit/{{ item.id }}">編集</a>
            <a class="delete-btn" href="/delete/{{ item.id }}">削除</a>
        </span>

    </div>
    {% endfor %}

</body>

</html>
